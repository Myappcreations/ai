
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#080d1b">
<title>Mission Master AI</title>

<style>
:root{
  color-scheme:dark;
  --bg:#080d1b;
  --panel:#111b2e;
  --panel2:#17243a;
  --line:#293b57;
  --text:#edf4ff;
  --muted:#9babc3;
  --accent:#60a5fa;
  --green:#34d399;
  --red:#fb7185;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  background:radial-gradient(circle at top,#172b49 0,#080d1b 45%);
  color:var(--text);
  font-family:Arial,Helvetica,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.app{
  width:min(100%,850px);
  margin:auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  padding:14px;
  padding-bottom:calc(14px + env(safe-area-inset-bottom));
}
header{
  display:flex;
  align-items:center;
  gap:12px;
  padding:8px 2px 16px;
  border-bottom:1px solid var(--line);
}
.logo{
  width:46px;height:46px;border-radius:15px;
  display:grid;place-items:center;
  background:linear-gradient(135deg,#2563eb,#7c3aed);
  font-size:24px;font-weight:bold;
  box-shadow:0 8px 30px #2563eb55;
}
.brand{flex:1;min-width:0}
.brand h1{font-size:19px;margin:0 0 4px}
.brand p{font-size:12px;color:var(--muted);margin:0}
.status{
  font-size:11px;color:var(--green);
  border:1px solid #1d624d;border-radius:20px;
  padding:6px 9px;white-space:nowrap;
}
.hero{
  text-align:center;
  padding:22px 8px 18px;
}
.orb{
  width:86px;height:86px;margin:0 auto 12px;
  border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#a5d8ff,#3b82f6 35%,#312e81 75%);
  box-shadow:0 0 35px #3b82f677, inset -8px -10px 25px #111b2e;
  animation:glow 4s ease-in-out infinite;
}
@keyframes glow{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.04)}
}
.hero h2{font-size:21px;margin:0 0 7px}
.hero p{font-size:13px;color:var(--muted);margin:0}
.quick{
  display:flex;flex-wrap:wrap;justify-content:center;
  gap:8px;margin-top:15px;
}
.quick button,.small-btn{
  border:1px solid var(--line);
  color:#dceaff;background:#111b2e;
  border-radius:20px;padding:8px 12px;font-size:12px;
}
.quick button:active,.small-btn:active{background:#203757}
.chat{
  flex:1;min-height:220px;
  display:flex;flex-direction:column;gap:13px;
  padding:8px 0 18px;
}
.welcome{
  text-align:center;color:var(--muted);
  font-size:13px;padding:22px 10px;
}
.message{
  max-width:95%;padding:13px 14px;
  border:1px solid var(--line);
  border-radius:16px;line-height:1.55;
  overflow-wrap:anywhere;
}
.message.user{
  align-self:flex-end;
  background:#17345a;border-color:#28517e;
  border-bottom-right-radius:5px;
}
.message.assistant{
  align-self:flex-start;
  background:#111b2e;border-bottom-left-radius:5px;
}
.message .role{
  font-size:10px;text-transform:uppercase;
  letter-spacing:1px;color:#8ebeff;
  margin-bottom:7px;font-weight:bold;
}
.message.user .role{color:#a7d5ff}
.message p{margin:7px 0}
.message h1,.message h2,.message h3{line-height:1.3;margin:13px 0 7px}
.message h1{font-size:20px}
.message h2{font-size:18px}
.message h3{font-size:16px}
.message ul,.message ol{padding-left:22px;margin:8px 0}
.message li{margin:5px 0}
.message blockquote{
  border-left:3px solid var(--accent);
  margin:10px 0;padding:5px 12px;
  color:#c5d6ed;background:#14243a;
}
.message pre{
  overflow:auto;padding:12px;
  background:#050a13;border:1px solid var(--line);
  border-radius:9px;font-size:12px;
}
.message code{
  background:#25344b;padding:2px 5px;border-radius:5px;
  font-family:monospace;font-size:.92em;
}
.message pre code{background:none;padding:0}
.table-wrap{overflow-x:auto;margin:10px 0}
.message table{
  border-collapse:collapse;width:100%;min-width:340px;
  font-size:12px;
}
.message th,.message td{
  border:1px solid #344966;padding:8px;text-align:left;
  vertical-align:top;
}
.message th{background:#1c3554}
.message a{color:#8ec5ff;text-decoration:underline}
.message hr{border:0;border-top:1px solid var(--line);margin:13px 0}
.message .meta{
  font-size:10px;color:var(--muted);margin-top:10px;
}
.quality{
  margin-top:9px;padding:8px 10px;
  border-radius:9px;background:#172b35;
  border:1px solid #28634f;color:#a7f3d0;font-size:11px;
}
.quality.warning{
  background:#352718;border-color:#775328;color:#fde68a;
}
.controls{
  display:flex;gap:7px;flex-wrap:wrap;margin-top:9px;
}
.controls button{
  background:#1a2a41;color:#d7e7ff;
  border:1px solid #344966;border-radius:8px;
  padding:7px 10px;font-size:11px;
}
.composer{
  position:sticky;bottom:0;
  background:linear-gradient(180deg,transparent,#080d1b 18%);
  padding-top:10px;
}
.inputbox{
  display:flex;gap:8px;align-items:flex-end;
  background:#111b2e;border:1px solid #344966;
  border-radius:16px;padding:9px;
}
#messageInput{
  flex:1;resize:none;min-height:42px;max-height:140px;
  border:0;outline:0;background:transparent;
  color:white;padding:10px 5px;
}
#messageInput::placeholder{color:#71839d}
.icon-btn{
  width:42px;height:42px;border-radius:12px;
  border:1px solid #344966;background:#1b2d46;
  color:white;font-size:18px;
}
.send{
  background:linear-gradient(135deg,#2563eb,#4f46e5);
  border:0;font-size:16px;
}
.mic.active{background:#7f1d1d;border-color:#fb7185}
.bottom{
  display:flex;justify-content:space-between;
  align-items:center;gap:8px;flex-wrap:wrap;
  margin-top:9px;color:var(--muted);font-size:11px;
}
.bottom-actions{display:flex;gap:7px;flex-wrap:wrap}
.bottom button{
  background:transparent;color:var(--muted);
  border:1px solid var(--line);border-radius:8px;
  padding:7px 9px;font-size:11px;
}
#toast{
  position:fixed;bottom:100px;left:50%;
  transform:translateX(-50%);
  background:#1e3451;color:white;
  padding:10px 15px;border-radius:10px;
  font-size:12px;display:none;z-index:10;
  max-width:90%;text-align:center;
}
@media(min-width:650px){
  .app{padding:20px}
  .hero{padding:26px}
  .message{max-width:90%}
}
</style>
</head>

<body>
<div class="app">

<header>
  <div class="logo">M</div>
  <div class="brand">
    <h1>Mission Master AI</h1>
    <p>Your personal AI research and voice assistant</p>
  </div>
  <div class="status" id="status">● Ready</div>
</header>

<section class="hero">
  <div class="orb"></div>
  <h2>Think. Research. Create.</h2>
  <p>Ask in Telugu or English. Explore ideas and get things done.</p>

  <div class="quick">
    <button data-prompt="Research the latest AI developments in India.">🌐 AI Research</button>
    <button data-prompt="Explain today's important stock market risks in simple Telugu.">📊 Market</button>
    <button data-prompt="Teach me one practical AI skill today.">🚀 Learn AI</button>
    <button data-prompt="Explain pivot points in stock trading with formulas and an example.">📈 Trading</button>
  </div>
</section>

<main class="chat" id="chat">
  <div class="welcome" id="welcome">
    Your conversation will appear here.<br>
    Type a message or tap the microphone to speak.
  </div>
</main>

<section class="composer">
  <div class="inputbox">
    <button class="icon-btn mic" id="micBtn" title="Voice input">🎙</button>
    <textarea id="messageInput" rows="1" placeholder="Ask Mission Master AI..."></textarea>
    <button class="icon-btn send" id="sendBtn" title="Send">➤</button>
  </div>

  <div class="bottom">
    <span id="voiceStatus">Telugu / English voice enabled</span>
    <div class="bottom-actions">
      <button id="stopVoiceBtn">Stop voice</button>
      <button id="clearBtn">Clear chat</button>
    </div>
  </div>
</section>

</div>
<div id="toast"></div>

<script>
"use strict";

const API_BASE =
  "https://mission-master-ai-api.chopparapardhu.workers.dev";

const HISTORY_KEY = "mission_master_history_v05";
const OLD_HISTORY_KEY = "mission_master_history";

const chat = document.getElementById("chat");
const input = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const statusEl = document.getElementById("status");
const voiceStatus = document.getElementById("voiceStatus");
const toastEl = document.getElementById("toast");

let conversation = [];
let appPassword = sessionStorage.getItem("mission_master_password") || "";
let recognition = null;
let listening = false;
let lastSpokenText = "";
let speechRate = 1;

function toast(message) {
  toastEl.textContent = message;
  toastEl.style.display = "block";
  clearTimeout(toast._timer);
  toast._timer = setTimeout(() => {
    toastEl.style.display = "none";
  }, 2600);
}

function setStatus(message) {
  statusEl.textContent = "● " + message;
}

function getPassword() {
  if (appPassword) return appPassword;

  const value = prompt("Enter your Mission Master AI private access password:");
  if (!value) return null;

  appPassword = value.trim();
  sessionStorage.setItem("mission_master_password", appPassword);
  return appPassword;
}

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, ch => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    '"':"&quot;",
    "'":"&#39;"
  })[ch]);
}

function decodeCommonEntities(value) {
  return String(value)
    .replace(/\\([*_`#])/g, "$1")
    .replace(/&amp;/gi, "&")
    .replace(/&lt;/gi, "<")
    .replace(/&gt;/gi, ">")
    .replace(/&quot;/gi, '"')
    .replace(/&#39;|&apos;/gi, "'")
    .replace(/&nbsp;/gi, " ");
}

function inlineMarkdown(source) {
  const text = decodeCommonEntities(source);
  const tokenPattern =
    /(\*\*[\s\S]+?\*\*|__[\s\S]+?__|(?<!\*)\*[^*\n]+\*(?!\*)|_[^_\n]+_|~~[\s\S]+?~~|`[^`\n]+`|\[[^\]]+\]\(https?:\/\/[^)\s]+\)|https?:\/\/[^\s<]+)/g;

  const fragment = document.createDocumentFragment();
  let last = 0;
  let match;

  while ((match = tokenPattern.exec(text)) !== null) {
    fragment.appendChild(document.createTextNode(text.slice(last, match.index)));

    const token = match[0];
    let node;

    if (token.startsWith("**") || token.startsWith("__")) {
      node = document.createElement("strong");
      node.textContent = token.slice(2, -2);
    } else if (token.startsWith("~~")) {
      node = document.createElement("del");
      node.textContent = token.slice(2, -2);
    } else if (token.startsWith("*") || token.startsWith("_")) {
      node = document.createElement("em");
      node.textContent = token.slice(1, -1);
    } else if (token.startsWith("`")) {
      node = document.createElement("code");
      node.textContent = token.slice(1, -1);
    } else {
      let label = token;
      let url = token;

      if (token.startsWith("[")) {
        const parts = token.match(/^\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)$/);
        if (parts) {
          label = parts[1];
          url = parts[2];
        }
      }

      try {
        const parsed = new URL(url);
        if (parsed.protocol === "http:" || parsed.protocol === "https:") {
          node = document.createElement("a");
          node.textContent = label;
          node.href = parsed.href;
          node.target = "_blank";
          node.rel = "noopener noreferrer";
        }
      } catch (_) {}
      if (!node) node = document.createTextNode(token);
    }

    fragment.appendChild(node);
    last = match.index + token.length;
  }

  fragment.appendChild(document.createTextNode(text.slice(last)));
  return fragment;
}

function isTableLine(line) {
  return /^\s*\|.*\|\s*$/.test(line);
}

function tableCells(line) {
  return line.trim().replace(/^\|/, "").replace(/\|$/, "")
    .split("|").map(x => x.trim());
}

function isTableDivider(line) {
  return isTableLine(line) &&
    tableCells(line).every(cell => /^:?-{3,}:?$/.test(cell));
}

function renderMarkdown(rawText, container) {
  const source = decodeCommonEntities(rawText || "");
  const lines = source.replace(/\r/g, "").split("\n");
  let i = 0;

  function addParagraph(items) {
    if (!items.length) return;
    const p = document.createElement("p");
    p.appendChild(inlineMarkdown(items.join(" ")));
    container.appendChild(p);
  }

  while (i < lines.length) {
    const line = lines[i];
    const trimmed = line.trim();

    if (!trimmed) { i++; continue; }

    if (trimmed.startsWith("```")) {
      const codeLines = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith("```")) {
        codeLines.push(lines[i]);
        i++;
      }
      if (i < lines.length) i++;

      const pre = document.createElement("pre");
      const code = document.createElement("code");
      code.textContent = codeLines.join("\n");
      pre.appendChild(code);
      container.appendChild(pre);
      continue;
    }

    if (/^---+$|^\*\*\*+$|^___+$/.test(trimmed)) {
      container.appendChild(document.createElement("hr"));
      i++;
      continue;
    }

    if (isTableLine(line) && i + 1 < lines.length &&
        isTableDivider(lines[i + 1])) {
      const rows = [];
      const headers = tableCells(line);
      i += 2;

      while (i < lines.length && isTableLine(lines[i])) {
        rows.push(tableCells(lines[i]));
        i++;
      }

      const wrap = document.createElement("div");
      wrap.className = "table-wrap";
      const table = document.createElement("table");
      const thead = document.createElement("thead");
      const headRow = document.createElement("tr");

      headers.forEach(value => {
        const th = document.createElement("th");
        th.appendChild(inlineMarkdown(value));
        headRow.appendChild(th);
      });

      thead.appendChild(headRow);
      table.appendChild(thead);

      const tbody = document.createElement("tbody");
      rows.forEach(row => {
        const tr = document.createElement("tr");
        headers.forEach((_, index) => {
          const td = document.createElement("td");
          td.appendChild(inlineMarkdown(row[index] || ""));
          tr.appendChild(td);
        });
        tbody.appendChild(tr);
      });

      table.appendChild(tbody);
      wrap.appendChild(table);
      container.appendChild(wrap);
      continue;
    }

    const heading = trimmed.match(/^(#{1,3})\s+(.+)$/);
    if (heading) {
      const h = document.createElement("h" + heading[1].length);
      h.appendChild(inlineMarkdown(heading[2]));
      container.appendChild(h);
      i++;
      continue;
    }

    if (trimmed.startsWith(">")) {
      const quoteLines = [];
      while (i < lines.length && lines[i].trim().startsWith(">")) {
        quoteLines.push(lines[i].trim().replace(/^>\s?/, ""));
        i++;
      }
      const blockquote = document.createElement("blockquote");
      blockquote.appendChild(inlineMarkdown(quoteLines.join(" ")));
      container.appendChild(blockquote);
      continue;
    }

    const unordered = trimmed.match(/^[-*+]\s+(.+)$/);
    const ordered = trimmed.match(/^\d+[.)]\s+(.+)$/);

    if (unordered || ordered) {
      const isOrdered = !!ordered;
      const list = document.createElement(isOrdered ? "ol" : "ul");

      while (i < lines.length) {
        const current = lines[i].trim();
        const item = current.match(isOrdered
          ? /^\d+[.)]\s+(.+)$/
          : /^[-*+]\s+(.+)$/);

        if (!item) break;

        const li = document.createElement("li");
        li.appendChild(inlineMarkdown(item[1]));
        list.appendChild(li);
        i++;
      }

      container.appendChild(list);
      continue;
    }

    const paragraph = [trimmed];
    i++;

    while (i < lines.length) {
      const next = lines[i].trim();
      if (!next || /^#{1,3}\s/.test(next) ||
          next.startsWith("```") || next.startsWith(">") ||
          isTableLine(next) || /^[-*+]\s+/.test(next) ||
          /^\d+[.)]\s+/.test(next) ||
          /^---+$|^\*\*\*+$|^___+$/.test(next)) break;

      paragraph.push(next);
      i++;
    }

    addParagraph(paragraph);
  }
}

function saveHistory() {
  try {
    localStorage.setItem(HISTORY_KEY, JSON.stringify(conversation.slice(-30)));
  } catch (error) {
    console.warn("History could not be saved:", error);
  }
}

function loadHistory() {
  let saved = null;

  try {
    saved = localStorage.getItem(HISTORY_KEY);
    if (!saved) saved = localStorage.getItem(OLD_HISTORY_KEY);
    const parsed = saved ? JSON.parse(saved) : [];

    if (Array.isArray(parsed)) {
      conversation = parsed
        .filter(x => x && ["user","assistant"].includes(x.role) &&
          typeof x.content === "string")
        .slice(-30);
    }
  } catch (_) {
    conversation = [];
  }

  chat.innerHTML = "";
  if (!conversation.length) {
    showWelcome();
    return;
  }

  conversation.forEach(item => {
    addMessage(item.role, item.content, false, null, false);
  });
}

function showWelcome() {
  const welcome = document.createElement("div");
  welcome.className = "welcome";
  welcome.id = "welcome";
  welcome.innerHTML =
    "Your conversation will appear here.<br>Type a message or tap the microphone to speak.";
  chat.appendChild(welcome);
}

function addMessage(role, content, save = true, quality = null, speak = false) {
  const welcome = document.getElementById("welcome");
  if (welcome) welcome.remove();

  const bubble = document.createElement("article");
  bubble.className = "message " + role;

  const label = document.createElement("div");
  label.className = "role";
  label.textContent = role === "user" ? "You" : "Mission Master AI";
  bubble.appendChild(label);

  const body = document.createElement("div");
  body.className = "message-body";
  if (role === "assistant") {
    renderMarkdown(content, body);
  } else {
    body.textContent = content;
  }
  bubble.appendChild(body);

  if (quality) {
    const q = document.createElement("div");
    const passed = quality.status === "links_present";
    q.className = "quality" + (passed ? "" : " warning");
    q.textContent = passed
      ? `Research links included: ${quality.uniqueSourceUrls}. Link count passed; claims and source dates are not independently verified.`
      : `Research warning: ${quality.uniqueSourceUrls || 0} source links found.`;
    bubble.appendChild(q);
  }

  if (role === "assistant") {
    const controls = document.createElement("div");
    controls.className = "controls";

    const replay = document.createElement("button");
    replay.textContent = "🔊 Replay";
    replay.addEventListener("click", () => speakText(content));

    const copy = document.createElement("button");
    copy.textContent = "Copy answer";
    copy.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(content);
        toast("Answer copied");
      } catch (_) {
        toast("Copy not available in this browser");
      }
    });

    controls.append(replay, copy);
    bubble.appendChild(controls);
  }

  chat.appendChild(bubble);
  chat.scrollTop = chat.scrollHeight;
  window.scrollTo({ top: document.body.scrollHeight, behavior: "smooth" });

  if (save) {
    conversation.push({ role, content });
    conversation = conversation.slice(-30);
    saveHistory();
  }

  if (speak && role === "assistant") speakText(content);
}

function plainTextForSpeech(text) {
  return String(text)
    .replace(/```[\s\S]*?```/g, " code omitted ")
    .replace(/\[([^\]]+)\]\(https?:\/\/[^)]+\)/g, "$1")
    .replace(/https?:\/\/\S+/g, "")
    .replace(/\|/g, " ")
    .replace(/[#*_`~]/g, "")
    .replace(/&amp;/g, "&")
    .replace(/&lt;/g, "<")
    .replace(/&gt;/g, ">")
    .replace(/\s+/g, " ")
    .trim();
}

function speakText(text) {
  if (!("speechSynthesis" in window)) {
    toast("Speech output is not supported in this browser");
    return;
  }

  speechSynthesis.cancel();
  lastSpokenText = plainTextForSpeech(text);

  const utterance = new SpeechSynthesisUtterance(lastSpokenText);
  const telugu = /[\u0C00-\u0C7F]/.test(lastSpokenText);

  utterance.lang = telugu ? "te-IN" : "en-IN";
  utterance.rate = speechRate;

  const voices = speechSynthesis.getVoices();
  const preferred = voices.find(v =>
    telugu
      ? v.lang.toLowerCase().startsWith("te")
      : v.lang.toLowerCase() === "en-in"
  );

  if (preferred) utterance.voice = preferred;
  utterance.onerror = () => {
    voiceStatus.textContent = "Voice playback unavailable";
  };
  utterance.onend = () => {
    voiceStatus.textContent = "Voice ready";
  };

  speechSynthesis.speak(utterance);
  voiceStatus.textContent = "Speaking...";
}

function stopVoice() {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  voiceStatus.textContent = "Voice stopped";
}

async function sendMessage(text) {
  const message = (text || input.value).trim();
  if (!message) return;

  const password = getPassword();
  if (!password) {
    toast("Private password is required");
    return;
  }

  input.value = "";
  input.style.height = "42px";

  addMessage("user", message);
  setStatus("Thinking...");
  sendBtn.disabled = true;

  const loading = document.createElement("div");
  loading.className = "message assistant";
  loading.id = "loadingMessage";
  loading.textContent = "Mission Master AI is thinking...";
  chat.appendChild(loading);

  try {
    const response = await fetch(API_BASE + "/chat", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": "Bearer " + password
      },
      body: JSON.stringify({
        message,
        history: conversation.slice(0, -1).slice(-10)
      })
    });

    const data = await response.json();
    loading.remove();

    if (response.status === 401 || response.status === 403) {
      sessionStorage.removeItem("mission_master_password");
      appPassword = "";
      setStatus("Password needed");
      toast("Private password incorrect. Please try again.");
      const newPassword = getPassword();
      if (newPassword) {
        input.value = message;
        await sendMessage(message);
      }
      return;
    }

    if (!response.ok) {
      throw new Error(data.error || "Server request failed");
    }

    if (!data.reply) throw new Error("Empty AI response");

    addMessage("assistant", data.reply, true, data.researchQuality, false);
    setStatus(data.mode === "deep_research" ? "Research complete" : "Ready");

  } catch (error) {
    const oldLoading = document.getElementById("loadingMessage");
    if (oldLoading) oldLoading.remove();

    addMessage(
      "assistant",
      "I couldn't complete that request.\n\n**Error:** " + error.message,
      false
    );
    setStatus("Connection issue");
  } finally {
    sendBtn.disabled = false;
    input.focus();
  }
}

function startRecognition() {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    toast("Voice input is not supported in this browser");
    return;
  }

  if (listening && recognition) {
    recognition.stop();
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "te-IN";
  recognition.continuous = false;
  recognition.interimResults = true;

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add("active");
    voiceStatus.textContent = "Listening...";
    setStatus("Listening");
  };

  recognition.onresult = event => {
    let finalText = "";
    let interimText = "";

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const text = event.results[i][0].transcript;
      if (event.results[i].isFinal) finalText += text;
      else interimText += text;
    }

    input.value = finalText || interimText;
  };

  recognition.onerror = event => {
    toast("Voice input: " + event.error);
  };

  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove("active");
    voiceStatus.textContent = "Telugu / English voice enabled";
    setStatus("Ready");
  };

  try {
    recognition.start();
  } catch (_) {
    toast("Please try the microphone again");
  }
}

sendBtn.addEventListener("click", () => sendMessage());

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    sendMessage();
  }
});

input.addEventListener("input", () => {
  input.style.height = "42px";
  input.style.height = Math.min(input.scrollHeight, 140) + "px";
});

micBtn.addEventListener("click", startRecognition);

document.getElementById("stopVoiceBtn").addEventListener("click", stopVoice);

document.getElementById("clearBtn").addEventListener("click", () => {
  if (!confirm("Clear this conversation from this browser?")) return;

  conversation = [];
  localStorage.removeItem(HISTORY_KEY);
  localStorage.removeItem(OLD_HISTORY_KEY);
  stopVoice();
  chat.innerHTML = "";
  showWelcome();
  toast("Conversation cleared");
});

document.querySelectorAll("[data-prompt]").forEach(button => {
  button.addEventListener("click", () => {
    sendMessage(button.dataset.prompt);
  });
});

// Voice speed shortcuts: tap the voice status text to cycle speeds.
voiceStatus.addEventListener("click", () => {
  speechRate = speechRate === 1 ? 1.5 : speechRate === 1.5 ? 2 : 1;
  voiceStatus.textContent = "Voice speed " + speechRate + "x";
  toast("Voice speed: " + speechRate + "x");
});

loadHistory();
</script>
